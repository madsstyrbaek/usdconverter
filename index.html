<title>USD Quick Convert</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600&display=swap">
<style>
  /* Layout: one compact column, input on top, rate rows below, status footer. Sized to sit in a screen corner. */
  :root {
    --bg: #0b0d0f;
    --panel: #15181c;
    --fg: #ffffff;
    --muted: #8a9199;
    --line: #262b31;
    --accent: #2ecc71;
    --accent-ink: #0b0d0f;
    --font-ui: "Barlow", "Segoe UI", system-ui, sans-serif;
    --font-label: "Barlow Condensed", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f4f6; --panel: #ffffff; --fg: #0b0d0f; --muted: #5b6470; --line: #d9dde3;
      --accent: #1aa854; --accent-ink: #ffffff; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f4f6; --panel: #ffffff; --fg: #0b0d0f; --muted: #5b6470; --line: #d9dde3;
    --accent: #1aa854; --accent-ink: #ffffff; color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px;
    display: flex; flex-direction: column; gap: 10px;
    font-variant-numeric: tabular-nums;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #logo { height: 24px; width: auto; display: block; }
  :root[data-theme="dark"] #logo { filter: brightness(0) invert(1); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #logo { filter: brightness(0) invert(1); } }
  .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  h1 { margin: 0; font: 600 13px/1 var(--font-label); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  #date { font-size: 11px; color: var(--muted); }

  .input-wrap {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    background: var(--panel); border: 2px solid var(--accent); border-radius: 6px; padding: 0 12px;
  }
  #amount {
    width: 100%; min-width: 0; background: none; border: 0; outline: none; color: var(--fg);
    font: 700 30px/1.3 var(--font-ui); padding: 8px 0;
  }
  #amount::placeholder { color: var(--muted); font-weight: 500; }
  .code { font: 600 14px/1 var(--font-label); letter-spacing: .1em; color: var(--accent); }

  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: grid; grid-template-columns: 56px 1fr; align-items: baseline; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px;
  }
  .row .code { color: var(--muted); }
  .row .val { font-size: 22px; font-weight: 700; text-align: right; overflow-wrap: anywhere; }
  .row small { grid-column: 1 / -1; font-size: 11px; color: var(--muted); text-align: right; }

  footer { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); margin-top: auto; }
  #status b { color: var(--accent); font-weight: 600; }
  #status.warn b { color: #e0a82e; }
  .btns { display: flex; gap: 4px; }
  .btns button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 4px; padding: 2px 8px; font: inherit; cursor: pointer; line-height: 1.3; }
  .btns button:hover, .btns button:focus-visible { border-color: var(--accent); color: var(--fg); outline: none; }
  @media (prefers-reduced-motion: no-preference) { .row { transition: border-color .15s; } }
</style>

  <span class="meta"><h1>USD convert</h1><span id="date"></span></span>
</header>

<div class="input-wrap">
  <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="Amount in US dollars">
  <span class="code">USD</span>
</div>

<div class="rows" id="rows"></div>

<footer>
  <span id="status">Loading rates…</span>
  <span class="btns">
    <button id="theme" type="button" title="Skift mellem lys og mørk">☾</button>
    <button id="refresh" type="button" title="Fetch rates again">↻</button>
  </span>
</footer>

<script>
  // Add or reorder currencies here. Frankfurter supports every ECB currency (SEK, NOK, PLN, JPY, CNY…).
  const CURRENCIES = ['DKK', 'EUR', 'GBP'];
  const BASE = 'USD';
  const API = 'https://api.frankfurter.app/latest?from=' + BASE + '&to=' + CURRENCIES.join(',');
  const CACHE_KEY = 'usd-convert-rates';
  const MAX_AGE_MS = 20 * 60 * 60 * 1000; // refetch when cache older than 20 h (ECB publishes once a day)

  // Fallback used only if the API cannot be reached (e.g. in a sandboxed preview).
  const SAMPLE = { date: 'sample', rates: { DKK: 6.85, EUR: 0.92, GBP: 0.77 } };

  const amountEl = document.getElementById('amount');
  const rowsEl = document.getElementById('rows');
  const dateEl = document.getElementById('date');
  const statusEl = document.getElementById('status');
  let rates = null;

  // Build one row per currency
  for (const c of CURRENCIES) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<span class="code">' + c + '</span><span class="val" id="val-' + c + '">–</span><small id="rate-' + c + '"></small>';
    rowsEl.appendChild(row);
  }

  const fmt = new Intl.NumberFormat('da-DK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function parseAmount(s) {
    // Accept 1,234.56 and 1.234,56 and plain 1234.56
    s = String(s).trim().replace(/\s/g, '');
    if (!s) return 0;
    if (s.includes(',') && s.includes('.')) {
      s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    } else if (s.includes(',')) {
      s = s.replace(',', '.');
    }
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }

  function render() {
    if (!rates) return;
    const amt = parseAmount(amountEl.value);
    for (const c of CURRENCIES) {
      const r = rates.rates[c];
      document.getElementById('val-' + c).textContent = r ? fmt.format(amt * r) : 'n/a';
      document.getElementById('rate-' + c).textContent = r ? '1 USD = ' + r.toFixed(4) + ' ' + c : '';
    }
  }

  function applyRates(data, source) {
    rates = data;
    dateEl.textContent = data.date === 'sample' ? 'sample rates' : data.date;
    statusEl.className = source === 'sample' ? 'warn' : '';
    statusEl.innerHTML = source === 'live' ? 'ECB rates <b>live</b>'
                       : source === 'cache' ? 'ECB rates <b>cached</b>'
                       : '<b>Offline sample</b> – open the real file for live rates';
    render();
  }

  function readCache() {
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (c && c.saved && Date.now() - c.saved < MAX_AGE_MS && c.data) return c.data;
    } catch (e) {}
    return null;
  }

  async function fetchRates(force) {
    const cached = force ? null : readCache();
    if (cached) { applyRates(cached, 'cache'); return; }
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ saved: Date.now(), data })); } catch (e) {}
      applyRates(data, 'live');
    } catch (e) {
      const stale = (() => { try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null')?.data; } catch (_) { return null; } })();
      applyRates(stale || SAMPLE, stale ? 'cache' : 'sample');
    }
  }

  // Focus behaviour: whenever the window gets focus (Win+number, Alt-Tab, click), land in the input with the old value selected.
  function grab() { amountEl.focus(); amountEl.select(); }
  window.addEventListener('focus', grab);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) grab(); });
  document.addEventListener('click', e => { if (!e.target.closest('button')) grab(); });
  amountEl.addEventListener('input', render);
  amountEl.addEventListener('keydown', e => { if (e.key === 'Escape') { amountEl.value = ''; render(); } });
  document.getElementById('refresh').addEventListener('click', () => fetchRates(true));

  // Light/dark toggle. Sets data-theme on <html>, remembered in localStorage. No stored choice = follow Windows.
  const themeBtn = document.getElementById('theme');
  const THEME_KEY = 'usd-convert-theme';
  function currentTheme() {
    const t = document.documentElement.dataset.theme;
    if (t) return t;
    return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    themeBtn.textContent = t === 'dark' ? '☀' : '☾';
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  themeBtn.addEventListener('click', () => applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'));
  try { const saved = localStorage.getItem(THEME_KEY); if (saved) applyTheme(saved); else themeBtn.textContent = currentTheme() === 'dark' ? '☀' : '☾'; } catch (e) {}

  fetchRates(false);
  grab();
</script>
