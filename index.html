<!DOCTYPE html>
<meta charset="utf-8">
<title>Quick Convert</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600&display=swap">
<style>
  /* Layout: one compact column, input on top, rate rows below, status footer. Sized to sit in a screen corner. */
  :root {
    --bg: #0b0d0f;
    --panel: #15181c;
    --fg: #ffffff;
    --muted: #8a9199;
    --line: #262b31;
    --accent: #2ecc71;
    --accent-ink: #0b0d0f;
    --font-ui: "Barlow", "Segoe UI", system-ui, sans-serif;
    --font-label: "Barlow Condensed", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f4f6; --panel: #ffffff; --fg: #0b0d0f; --muted: #5b6470; --line: #d9dde3;
      --accent: #1aa854; --accent-ink: #ffffff; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f4f6; --panel: #ffffff; --fg: #0b0d0f; --muted: #5b6470; --line: #d9dde3;
    --accent: #1aa854; --accent-ink: #ffffff; color-scheme: light;
  }
  html { height: 100%; overflow: hidden; }
  body {
    box-sizing: border-box; height: 100%; margin: 0;
    background: var(--bg); color: var(--fg); font-family: var(--font-ui);
    padding-left: max(10px, env(safe-area-inset-left, 0px));
    padding-right: max(10px, env(safe-area-inset-right, 0px));
    padding-block: 8px;
    display: flex; flex-direction: column; gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #logo { height: 18px; width: auto; display: block; }
  :root[data-theme="dark"] #logo { filter: brightness(0) invert(1); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #logo { filter: brightness(0) invert(1); } }
  .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  h1 { margin: 0; font: 600 11px/1 var(--font-label); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  #date { font-size: 10px; color: var(--muted); }

  /* Flip card: front = converter, back = calculator. Ctrl+Tab toggles .flipped on #card. */
  #card { position: relative; perspective: 900px; }
  .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .front { position: relative; }
  .back { position: absolute; inset: 0; transform: rotateY(180deg); display: grid; grid-template-rows: auto 1fr; gap: 6px; }
  #inner { position: relative; transform-style: preserve-3d; }
  #card.flipped #inner { transform: rotateY(180deg); }
  @media (prefers-reduced-motion: no-preference) { #inner { transition: transform .35s ease; } }

  /* One row per currency, fixed order. Each row is an input; the one with the cursor is the currency converted from. */
  .rows { display: flex; flex-direction: column; gap: 5px; }
  .row {
    display: grid; grid-template-columns: 44px 1fr; align-items: baseline; column-gap: 6px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 5px; padding: 5px 9px; cursor: text;
  }
  .row .code { font: 600 12px/1 var(--font-label); letter-spacing: .1em; color: var(--muted); }
  .row input {
    width: 100%; min-width: 0; background: none; border: 0; outline: none; color: var(--fg); padding: 0;
    font: 700 18px/1.2 var(--font-ui); text-align: right; font-variant-numeric: tabular-nums;
  }
  .row input::placeholder { color: var(--muted); font-weight: 500; }
  .row small { grid-column: 1 / -1; font-size: 10px; color: var(--muted); text-align: right; line-height: 1.1; min-height: 11px; }
  .row.active { border-color: var(--accent); }
  .row.active .code, .row.active small { color: var(--accent); }

  /* Calculator (back face) */
  .calc-display {
    background: var(--panel); border: 2px solid var(--accent); border-radius: 5px; padding: 4px 10px;
    display: flex; flex-direction: column; align-items: flex-end; min-width: 0;
  }
  #calc-expr { font-size: 10px; color: var(--muted); min-height: 12px; line-height: 1.2; overflow-wrap: anywhere; }
  #calc-out { font: 700 24px/1.25 var(--font-ui); overflow-wrap: anywhere; text-align: right; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; min-height: 0; }
  .keys button {
    background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 5px;
    font: 600 14px/1 var(--font-ui); cursor: pointer; padding: 0; min-height: 26px; min-width: 0;
  }
  .keys button.op { color: var(--accent); }
  .keys button.eq { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .keys button.dim { color: var(--muted); font-size: 12px; }
  .keys button:hover { border-color: var(--accent); }
  .keys button:active { transform: translateY(1px); }

  footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 10px; color: var(--muted); margin-top: auto; }
  #status b { color: var(--accent); font-weight: 600; }
  #status.warn b { color: #e0a82e; }
  .btns { display: flex; gap: 4px; }
  .btns button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 4px; padding: 1px 7px; font: inherit; cursor: pointer; line-height: 1.3; }
  .btns button:hover { border-color: var(--accent); color: var(--fg); outline: none; }
  @media (prefers-reduced-motion: no-preference) { .row { transition: border-color .15s; } }
</style>

  <div id="inner">

        <button type="button" data-k="9">9</button>
        <button type="button" data-k="*" class="op">×</button>
        <button type="button" data-k="4">4</button>
        <button type="button" data-k="5">5</button>
        <button type="button" data-k="6">6</button>
        <button type="button" data-k="-" class="op">−</button>
        <button type="button" data-k="1">1</button>
        <button type="button" data-k="2">2</button>
        <button type="button" data-k="3">3</button>
        <button type="button" data-k="+" class="op">+</button>
        <button type="button" data-k="neg" class="dim">±</button>
        <button type="button" data-k="0">0</button>
        <button type="button" data-k="." >,</button>
        <button type="button" data-k="=" class="eq">=</button>
      </div>
    </div>
  </div>
</div>

<footer>
  <span id="status">Loading rates…</span>
  <span class="btns">
    <button id="flip" type="button" tabindex="-1" title="Skift mellem omregner og lommeregner (Ctrl+Tab)">⇄</button>
    <button id="theme" type="button" tabindex="-1" title="Skift mellem lys og mørk">☾</button>
    <button id="refresh" type="button" tabindex="-1" title="Fetch rates again">↻</button>
  </span>
</footer>

<script>
  // Add or reorder currencies here. Frankfurter supports every ECB currency (SEK, NOK, PLN, JPY, CNY…).
  const CURRENCIES = ['DKK', 'EUR', 'GBP'];
  const BASE = 'USD';
  const APIS = [
    'https://api.frankfurter.dev/v1/latest?base=' + BASE + '&symbols=' + CURRENCIES.join(','),
    'https://api.frankfurter.app/latest?from=' + BASE + '&to=' + CURRENCIES.join(','),
  ];
  const CACHE_KEY = 'usd-convert-rates';
  const MAX_AGE_MS = 20 * 60 * 60 * 1000; // refetch when cache older than 20 h (ECB publishes once a day)

  // Fallback used only if the API cannot be reached (e.g. in a sandboxed preview).
  const SAMPLE = { date: 'sample', rates: { DKK: 6.85, EUR: 0.92, GBP: 0.77 } };

  const rowsEl = document.getElementById('rows');
  const dateEl = document.getElementById('date');
  const statusEl = document.getElementById('status');
  let rates = null;

  // One input per currency in a fixed order. Tab moves the cursor to the next field; the field with the cursor is the
  // currency converted from, and the other fields show the result.
  const ALL = [BASE, ...CURRENCIES];
  const inputs = {};
  let src = BASE;

  for (const c of ALL) {
    const row = document.createElement('label');
    row.className = 'row';
    row.id = 'row-' + c;
    row.innerHTML = '<span class="code">' + c + '</span><input id="in-' + c + '" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" aria-label="Amount in ' + c + '"><small id="rate-' + c + '"></small>';
    rowsEl.appendChild(row);
    inputs[c] = row.querySelector('input');
    inputs[c].addEventListener('focus', () => setSource(c));
    inputs[c].addEventListener('input', () => { setSource(c); renderValues(); });
  }
  function setSource(c) {
    src = c;
    for (const k of ALL) document.getElementById('row-' + k).classList.toggle('active', k === src);
    renderRates();
  }
  // Rates are stored per 1 USD; anything else is a cross rate through USD.
  function cross(from, to) {
    if (!rates) return 0;
    const a = from === BASE ? 1 : rates.rates[from], b = to === BASE ? 1 : rates.rates[to];
    return a && b ? b / a : 0;
  }

  const fmt = new Intl.NumberFormat('da-DK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function parseAmount(s) {
    // Accept 1,234.56 and 1.234,56 and plain 1234.56
    s = String(s).trim().replace(/\s/g, '');
    if (!s) return 0;
    if (s.includes(',') && s.includes('.')) {
      s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    } else if (s.includes(',')) {
      s = s.replace(',', '.');
    }
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }

  // Fills every field except the one being typed in.
  function renderValues() {
    if (!rates) return;
    const raw = inputs[src].value.trim();
    const amt = parseAmount(raw);
    for (const c of ALL) {
      if (c === src) continue;
      const r = cross(src, c);
      inputs[c].value = !raw ? '' : r ? fmt.format(amt * r) : 'n/a';
    }
  }
  function renderRates() {
    for (const c of ALL) {
      const r = c === src ? 0 : cross(src, c);
      document.getElementById('rate-' + c).textContent = c === src ? 'omregnes fra' : r ? '1 ' + src + ' = ' + r.toFixed(4) + ' ' + c : '';
    }
  }
  function render() { renderValues(); renderRates(); }

  function applyRates(data, source) {
    rates = data;
    dateEl.textContent = data.date === 'sample' ? 'eksempelkurser' : 'ECB ' + data.date;
    statusEl.className = source === 'sample' ? 'warn' : '';
    statusEl.innerHTML = source === 'live' ? 'Kurser <b>hentet nu</b>'
                       : source === 'cache' ? 'Kurser <b>fra cache</b>'
                       : '<b>Ingen forbindelse</b> – viser eksempelkurser, tryk ↻';
    render();
  }

  function readCache() {
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (c && c.saved && Date.now() - c.saved < MAX_AGE_MS && c.data) return c.data;
    } catch (e) {}
    return null;
  }

  async function fetchRates(force) {
    const cached = force ? null : readCache();
    if (cached) { applyRates(cached, 'cache'); return; }
    try {
      let data = null, lastErr = null;
      for (const url of APIS) {
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          data = await res.json();
          if (data && data.rates) break;
        } catch (e) { lastErr = e; }
      }
      if (!data || !data.rates) throw lastErr || new Error('no data');
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ saved: Date.now(), data })); } catch (e) {}
      applyRates(data, 'live');
    } catch (e) {
      const stale = (() => { try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null')?.data; } catch (_) { return null; } })();
      applyRates(stale || SAMPLE, stale ? 'cache' : 'sample');
    }
  }

  // ---------- Flip between converter (front) and calculator (back) ----------
  const cardEl = document.getElementById('card');
  const h1El = document.querySelector('h1');
  let flipped = false;

  // grab() puts the cursor where the active side needs it: converter = active field focused with its value selected,
  // calculator = input blurred so numpad keys go to the calculator instead.
  function grab() {
    if (flipped) { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
    else { inputs[src].focus(); inputs[src].select(); }
  }
  function setFlipped(v) {
    flipped = v;
    cardEl.classList.toggle('flipped', flipped);
    h1El.textContent = flipped ? 'Lommeregner' : 'Quick convert';
    grab();
  }
  // Coming back to the window (Win+number, Alt-Tab, restore from minimised) always starts over:
  // converter side, cursor in the USD field, old value selected so the next keystroke overwrites it.
  function home() {
    setSource(BASE);
    setFlipped(false);
  }
  window.addEventListener('focus', home);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) home(); });
  document.addEventListener('click', e => { if (!e.target.closest('button')) grab(); });
  document.getElementById('refresh').addEventListener('click', () => fetchRates(true));
  document.getElementById('flip').addEventListener('click', () => setFlipped(!flipped));

  // Tab never moves focus to the footer buttons. Ctrl+Tab flips between converter and calculator.
  // Plain Tab moves the cursor to the next currency field (Shift+Tab to the previous); from the calculator it just returns to the converter.
  // Everything else routes to the active side.
  document.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      if (e.ctrlKey) setFlipped(!flipped);
      else if (flipped) setFlipped(false);
      else { setSource(ALL[(ALL.indexOf(src) + (e.shiftKey ? ALL.length - 1 : 1)) % ALL.length]); grab(); }
      return;
    }
    if (flipped) { if (calcKey(e.key)) e.preventDefault(); return; }
    if (e.key === 'Escape') { for (const c of ALL) inputs[c].value = ''; }
  }, true);

  // ---------- Calculator ----------
  // State survives flipping away. After "=" the next digit starts fresh, an operator continues from the result
  // (same feel as Windows Calculator). Delete/Esc = C, Backspace removes last digit.
  const exprEl = document.getElementById('calc-expr');
  const outEl = document.getElementById('calc-out');
  const calc = { acc: null, op: null, cur: '0', fresh: true, done: false };
  const cfmt = new Intl.NumberFormat('da-DK', { maximumFractionDigits: 10 });
  const OPS = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  function num(s) { return parseFloat(String(s).replace(',', '.')) || 0; }
  function show(n) { return isFinite(n) ? cfmt.format(n) : 'Fejl'; }
  function apply(a, op, b) {
    switch (op) { case '+': return a + b; case '-': return a - b; case '*': return a * b; case '/': return b === 0 ? NaN : a / b; }
    return b;
  }
  function paint() {
    outEl.textContent = calc.fresh ? show(num(calc.cur)) : calc.cur.replace('.', ',');
    exprEl.textContent = calc.acc !== null && calc.op ? show(calc.acc) + ' ' + OPS[calc.op] : (calc.done ? '=' : '');
  }
  function calcKey(k) {
    if (k === ',' || k === 'Decimal') k = '.';
    if (k === 'Enter') k = '=';
    if (k === 'Delete' || k === 'Escape') k = 'C';
    if (k === 'x' || k === 'X') k = '*';
    if (/^[0-9]$/.test(k)) {
      if (calc.fresh) { if (calc.done) { calc.acc = null; calc.op = null; calc.done = false; } calc.cur = k; calc.fresh = false; }
      else if (calc.cur.length < 15) calc.cur = calc.cur === '0' ? k : calc.cur + k;
    } else if (k === '.') {
      if (calc.fresh) { if (calc.done) { calc.acc = null; calc.op = null; calc.done = false; } calc.cur = '0.'; calc.fresh = false; }
      else if (!calc.cur.includes('.')) calc.cur += '.';
    } else if (k in OPS) {
      const v = num(calc.cur);
      if (calc.op && !calc.fresh && calc.acc !== null) calc.acc = apply(calc.acc, calc.op, v);
      else if (calc.acc === null || calc.done) calc.acc = v;
      calc.op = k; calc.cur = String(calc.acc); calc.fresh = true; calc.done = false;
    } else if (k === '=') {
      if (calc.op && calc.acc !== null) {
        const r = apply(calc.acc, calc.op, num(calc.cur));
        calc.cur = String(r); calc.acc = null; calc.op = null;
      }
      calc.fresh = true; calc.done = true;
    } else if (k === '%') {
      const v = num(calc.cur);
      let r;
      if (calc.op && calc.acc !== null) r = (calc.op === '+' || calc.op === '-') ? calc.acc * v / 100 : v / 100;
      else r = v / 100;
      calc.cur = String(r); calc.fresh = false;
    } else if (k === 'neg') {
      calc.cur = calc.cur.startsWith('-') ? calc.cur.slice(1) : (num(calc.cur) === 0 ? calc.cur : '-' + calc.cur);
    } else if (k === 'Backspace') {
      if (!calc.fresh) { calc.cur = calc.cur.length > 1 ? calc.cur.slice(0, -1) : '0'; if (calc.cur === '-') calc.cur = '0'; }
    } else if (k === 'CE') {
      calc.cur = '0'; calc.fresh = true; calc.done = false;
    } else if (k === 'C') {
      calc.acc = null; calc.op = null; calc.cur = '0'; calc.fresh = true; calc.done = false;
    } else {
      return false;
    }
    paint();
    return true;
  }
  const keysEl = document.getElementById('keys');
  keysEl.addEventListener('mousedown', e => e.preventDefault()); // keep focus off the buttons so Enter/keys stay global
  keysEl.addEventListener('click', e => { const b = e.target.closest('button'); if (b) calcKey(b.dataset.k); });
  for (const b of keysEl.querySelectorAll('button')) b.tabIndex = -1;
  paint();

  // Light/dark toggle. Sets data-theme on <html>, remembered in localStorage. No stored choice = follow Windows.
  const themeBtn = document.getElementById('theme');
  const THEME_KEY = 'usd-convert-theme';
  function currentTheme() {
    const t = document.documentElement.dataset.theme;
    if (t) return t;
    return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    themeBtn.textContent = t === 'dark' ? '☀' : '☾';
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  themeBtn.addEventListener('click', () => applyTheme(currentTheme() === 'dark' ? 'light' : 'dark'));
  try { const saved = localStorage.getItem(THEME_KEY); if (saved) applyTheme(saved); else themeBtn.textContent = currentTheme() === 'dark' ? '☀' : '☾'; } catch (e) {}

  setSource(BASE);
  fetchRates(false);
  grab();
</script>
